<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Administrativo - ElectroFix</title>
  
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%232563eb'/><circle cx='50' cy='55' r='25' fill='%23ffffff' stroke='%231d4ed8' stroke-width='6'/><circle cx='50' cy='55' r='16' fill='%2393c5fd'/><rect x='25' y='20' width='50' height='10' rx='3' fill='%23ffffff'/><circle cx='35' cy='25' r='2' fill='%232563eb'/><circle cx='43' cy='25' r='2' fill='%232563eb'/></svg>">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Estilos específicos para centrar el Login */
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .login-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 2.5rem;
      width: 100%;
      max-width: 420px;
      box-shadow: var(--shadow);
    }
    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .login-header .logo-icon {
      margin: 0 auto 0.5rem auto;
      display: block;
    }
  </style>
</head>
<body class="light-theme">

  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <svg class="logo-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" style="width: 50px; height: 50px;">
          <circle cx="50" cy="50" r="45" fill="var(--primary-color)"/>
          <circle cx="50" cy="55" r="25" fill="#ffffff" stroke="var(--primary-dark)" stroke-width="5"/>
          <circle cx="50" cy="55" r="16" fill="#93c5fd"/>
          <rect x="25" y="20" width="50" height="10" rx="3" fill="#ffffff"/>
          <circle cx="35" cy="25" r="2.5" fill="var(--primary-color)"/>
          <circle cx="43" cy="25" r="2.5" fill="var(--primary-color)"/>
        </svg>
        <h2 class="brand-name">Electro<span>Fix</span> Admin</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.3rem;">Acceso al Panel de Control</p>
      </div>

      <form id="login-form" class="contact-form">
        <div class="form-group">
          <label for="username">Usuario / Email</label>
          <input type="text" id="username" name="username" placeholder="admin@electrofix.com" required>
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 1rem;">
          <i data-lucide="log-in"></i> Iniciar Sesión
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem;">
        <a href="index.html" class="nav-link" style="font-size: 0.85rem;">&larr; Volver a la página principal</a>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();

      // Cargar preferencia de tema almacenada
      if (localStorage.getItem("theme") === "dark") {
        document.body.classList.add("dark-theme");
      }

      const loginForm = document.getElementById("login-form");
      loginForm.addEventListener("submit", (e) => {
        e.preventDefault();
        // Redirecciona al panel administrativo (Próximamente se conectará con autenticación MySQL/JWT)
        window.location.href = "admin.html";
      });
    });
  </script>
</body>
</html>
